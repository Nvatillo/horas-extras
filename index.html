<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horas Extra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171b18;
    --surface: #20251f;
    --surface-2: #262c25;
    --line: #33392f;
    --amber: #e8a33d;
    --rust: #d15b3e;
    --sage: #7fa37a;
    --text: #f2eee3;
    --muted: #8b9188;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: radial-gradient(ellipse at top, #1d2220 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 120px;
  }
  .wrap{ max-width:560px; margin:0 auto; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .eyebrow::before{
    content:"";
    width:7px; height:7px;
    background:var(--amber);
    border-radius:50%;
    box-shadow:0 0 8px var(--amber);
  }
  h1{
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:30px;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .sub{ color:var(--muted); font-size:13.5px; margin-bottom:24px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .card-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
    display:block;
  }
  .settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .rate-row{ display:flex; align-items:center; gap:8px; }
  .rate-row span{ font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:15px; }
  input[type="number"], input[type="month"], input[type="time"]{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:9px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    width:100%;
    outline:none;
  }
  input:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(232,163,61,.15);
  }
  .setup-note{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:10px; grid-column:1 / -1; }

  .month-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
  .month-row input{ max-width:180px; }

  .weekday-header{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .weekday-header span{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }
  .calendar{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
  }
  .day-cell{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:6px 4px 7px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    min-height:118px;
  }
  .day-cell.empty{ background:transparent; border-color:transparent; }
  .day-cell.weekend{ border-color:rgba(209,91,62,.35); }
  .day-num{
    font-family:'JetBrains Mono', monospace;
    color:var(--muted);
    font-size:12px;
  }
  .day-cell.weekend .day-num{ color:var(--rust); }
  .time-field{ width:100%; display:flex; flex-direction:column; gap:2px; }
  .time-field label{
    font-family:'JetBrains Mono', monospace;
    font-size:8.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }
  .day-cell input[type="time"]{
    padding:4px 2px;
    font-size:11px;
    text-align:center;
  }
  .day-cell.has-value{ border-color:var(--sage); }
  .day-extra{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--amber);
    min-height:13px;
  }

  @media (max-width:460px){
    .day-cell{ min-height:104px; padding:5px 2px 6px; }
    .day-cell input[type="time"]{ font-size:9.5px; padding:3px 1px; }
    .time-field label{ font-size:7.5px; }
    .day-extra{ font-size:9px; }
  }

  .clear-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
  }
  .clear-btn:hover{ border-color:var(--rust); color:var(--rust); }

  .readout{
    position:fixed;
    left:0; right:0; bottom:0;
    background:linear-gradient(180deg, #1a1e19, #12150f);
    border-top:1px solid var(--line);
    padding:14px 16px 18px;
    z-index:10;
  }
  .readout-inner{
    max-width:560px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:14px;
  }
  .readout-block{ text-align:left; }
  .readout-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:2px;
  }
  .readout-value{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:26px;
    color:var(--amber);
    text-shadow:0 0 14px rgba(232,163,61,.45);
    letter-spacing:.02em;
  }
  .readout-value.pay{
    color:var(--sage);
    text-shadow:0 0 14px rgba(127,163,122,.4);
    font-size:28px;
  }
  .readout-value small{ font-size:14px; color:var(--muted); margin-left:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Registro de jornada</div>
  <h1>Horas Extra</h1>
  <div class="sub">Cargá tu hora de entrada y salida cada día. La app calcula sola qué es hora extra.</div>

  <div class="card">
    <span class="card-label">Configuración</span>
    <div class="settings-grid">
      <div>
        <div class="rate-row">
          <span>$</span>
          <input type="number" id="rateInput" placeholder="Valor hora extra" min="0" step="0.01">
        </div>
      </div>
      <div>
        <input type="number" id="jornadaInput" placeholder="Horas de jornada normal" min="0" step="0.25">
      </div>
      <div class="setup-note" id="rateNote"></div>
    </div>
  </div>

  <div class="card">
    <div class="month-row">
      <span class="card-label" style="margin:0;">Mes</span>
      <input type="month" id="monthInput">
    </div>
    <div class="weekday-header">
      <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
    </div>
    <div class="calendar" id="daysList"></div>
  </div>

  <div style="display:flex; justify-content:flex-end;">
    <button class="clear-btn" id="clearBtn">Borrar mes actual</button>
  </div>
</div>

<div class="readout">
  <div class="readout-inner">
    <div class="readout-block">
      <div class="readout-tag">Total horas extra</div>
      <div class="readout-value" id="totalHoras">0.0<small>h</small></div>
    </div>
    <div class="readout-block" style="text-align:right;">
      <div class="readout-tag">Total a cobrar</div>
      <div class="readout-value pay" id="totalPago">$0.00</div>
    </div>
  </div>
</div>

<script>
const rateInput = document.getElementById('rateInput');
const jornadaInput = document.getElementById('jornadaInput');
const monthInput = document.getElementById('monthInput');
const daysList = document.getElementById('daysList');
const totalHorasEl = document.getElementById('totalHoras');
const totalPagoEl = document.getElementById('totalPago');
const rateNote = document.getElementById('rateNote');
const clearBtn = document.getElementById('clearBtn');

function todayMonthStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function daysInMonth(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function fmtMoney(n){
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function workedHours(inStr, outStr){
  if(!inStr || !outStr) return 0;
  const [ih, im] = inStr.split(':').map(Number);
  const [oh, om] = outStr.split(':').map(Number);
  let start = ih*60+im;
  let end = oh*60+om;
  if(end <= start) end += 24*60; // turno que cruza medianoche
  return (end-start)/60;
}
function extraHoursFor(day){
  const t = currentTimes[day];
  if(!t || !t.in || !t.out) return 0;
  const worked = workedHours(t.in, t.out);
  return Math.max(0, worked - (currentJornada || 0));
}

let currentRate = 0;
let currentJornada = 8;
let currentMonth = todayMonthStr();
let currentTimes = {}; // { "1": {in:"08:00", out:"18:30"}, ... }

async function loadSettings(){
  try{
    const v = localStorage.getItem('overtime:rate');
    currentRate = v ? parseFloat(v) : 0;
  }catch(e){ currentRate = 0; }
  try{
    const v = localStorage.getItem('overtime:jornada');
    currentJornada = v ? parseFloat(v) : 8;
  }catch(e){ currentJornada = 8; }
  rateInput.value = currentRate ? currentRate : '';
  jornadaInput.value = currentJornada ? currentJornada : '';
}
async function saveRate(val){
  currentRate = val;
  try{ localStorage.setItem('overtime:rate', String(val)); }
  catch(e){ console.error('No se pudo guardar la tarifa', e); }
}
async function saveJornada(val){
  currentJornada = val;
  try{ localStorage.setItem('overtime:jornada', String(val)); }
  catch(e){ console.error('No se pudo guardar la jornada', e); }
}
async function loadMonth(monthStr){
  try{
    const v = localStorage.getItem('overtime:month:' + monthStr);
    currentTimes = v ? JSON.parse(v) : {};
  }catch(e){ currentTimes = {}; }
}
async function saveMonth(monthStr){
  try{
    localStorage.setItem('overtime:month:' + monthStr, JSON.stringify(currentTimes));
  }catch(e){ console.error('No se pudo guardar el mes', e); }
}

function renderDays(){
  const [y,m] = currentMonth.split('-').map(Number);
  const total = daysInMonth(currentMonth);
  const firstDow = new Date(y, m-1, 1).getDay();
  daysList.innerHTML = '';

  for(let i=0; i<firstDow; i++){
    const empty = document.createElement('div');
    empty.className = 'day-cell empty';
    daysList.appendChild(empty);
  }

  for(let d=1; d<=total; d++){
    const dow = new Date(y, m-1, d).getDay();
    const isWeekend = dow === 0 || dow === 6;
    const t = currentTimes[d] || {};
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (isWeekend ? ' weekend' : '') + ((t.in && t.out) ? ' has-value' : '');
    cell.innerHTML = `
      <div class="day-num">${d}</div>
      <div class="time-field">
        <label>Entra</label>
        <input type="time" data-day="${d}" data-kind="in" value="${t.in || ''}">
      </div>
      <div class="time-field">
        <label>Sale</label>
        <input type="time" data-day="${d}" data-kind="out" value="${t.out || ''}">
      </div>
      <div class="day-extra" data-extra-for="${d}"></div>
    `;
    daysList.appendChild(cell);
    updateCellExtra(d);
  }
}

function updateCellExtra(day){
  const el = daysList.querySelector(`[data-extra-for="${day}"]`);
  if(!el) return;
  const extra = extraHoursFor(day);
  el.textContent = extra > 0 ? `+${extra.toFixed(2)}h` : '';
}

function calcTotals(){
  let totalH = 0;
  Object.keys(currentTimes).forEach(day=>{ totalH += extraHoursFor(day); });
  const totalP = totalH * (currentRate || 0);
  totalHorasEl.innerHTML = totalH.toLocaleString('es-AR', {minimumFractionDigits:1, maximumFractionDigits:2}) + '<small>h</small>';
  totalPagoEl.textContent = fmtMoney(totalP);
}

function updateRateNote(){
  const parts = [];
  parts.push(currentRate ? `Hora extra: ${fmtMoney(currentRate)}.` : 'Falta el valor de tu hora extra.');
  parts.push(`Jornada normal: ${currentJornada || 0}h por día — lo que trabajes de más cuenta como extra.`);
  rateNote.textContent = parts.join(' ');
}

daysList.addEventListener('input', async (e)=>{
  if(e.target.tagName !== 'INPUT') return;
  const day = e.target.dataset.day;
  const kind = e.target.dataset.kind;
  if(!currentTimes[day]) currentTimes[day] = {};
  currentTimes[day][kind] = e.target.value;
  if(!currentTimes[day].in && !currentTimes[day].out) delete currentTimes[day];

  const cell = e.target.closest('.day-cell');
  const t = currentTimes[day] || {};
  cell.classList.toggle('has-value', !!(t.in && t.out));
  updateCellExtra(day);
  calcTotals();
  await saveMonth(currentMonth);
});

rateInput.addEventListener('input', async ()=>{
  await saveRate(parseFloat(rateInput.value) || 0);
  updateRateNote();
  calcTotals();
});

jornadaInput.addEventListener('input', async ()=>{
  await saveJornada(parseFloat(jornadaInput.value) || 0);
  updateRateNote();
  renderDays();
  calcTotals();
});

monthInput.addEventListener('change', async ()=>{
  currentMonth = monthInput.value;
  await loadMonth(currentMonth);
  renderDays();
  calcTotals();
});

clearBtn.addEventListener('click', async ()=>{
  if(!confirm('¿Borrar todos los horarios cargados de este mes?')) return;
  currentTimes = {};
  await saveMonth(currentMonth);
  renderDays();
  calcTotals();
});

(async function init(){
  monthInput.value = currentMonth;
  await loadSettings();
  await loadMonth(currentMonth);
  updateRateNote();
  renderDays();
  calcTotals();
})();
</script>
</body>
</html>
